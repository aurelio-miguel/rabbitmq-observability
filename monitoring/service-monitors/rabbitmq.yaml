apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: rabbitmq
  namespace: monitoring
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - keda-rabbitmq-autoscaling

  selector:
    matchLabels:
      app: rabbitmq
      component: metrics

  endpoints:
    - port: metrics
      path: /metrics/per-object
      interval: 30s
      scrapeTimeout: 10s
