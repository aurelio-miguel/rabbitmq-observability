prometheus:
  enabled: true

  service:
    type: ClusterIP

  prometheusSpec:
    replicas: 1
    retention: 3d
    scrapeInterval: 30s
    evaluationInterval: 30s

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

    serviceMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring

    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        release: monitoring

grafana:
  enabled: true

  service:
    type: ClusterIP

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
